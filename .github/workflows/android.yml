name: Repository checks

on:
  push:
    branches: [main, Raman]
  pull_request:
    branches: [main, Raman]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure and docs
        run: |
          test -f FypProject/gradlew
          test -f FypProject/app/build.gradle.kts
          test -f FypProject/app/google-services.json.example
          test -f docs/ARCHITECTURE.md
          test -f docs/screenshots/image1.png
          test -f README.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper smoke test
        working-directory: FypProject
        run: |
          chmod +x gradlew
          ./gradlew --version
